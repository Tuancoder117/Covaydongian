<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Vây - Chơi Với Máy (MCTS)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e1e24;
            color: #f4f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .top-bar {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-link {
            color: #e6b87d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 24px;
            color: #e6b87d;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            justify-content: center;
        }
        select, button {
            padding: 8px 14px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        select {
            background-color: #2b2b36;
            color: #fff;
            border: 1px solid #444;
        }
        button {
            background-color: #d99b52;
            color: #1e1e24;
        }
        button:hover {
            background-color: #e8ae68;
        }
        button.secondary {
            background-color: #3a3a48;
            color: #fff;
        }
        button.secondary:hover {
            background-color: #4d4d5e;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            background: #2b2b36;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stone-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }
        .stone-black {
            background: radial-gradient(circle at 30% 30%, #555, #000);
        }
        .stone-white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }
        #turnIndicator {
            font-weight: bold;
            color: #4cd137;
            min-width: 170px;
            text-align: center;
        }
        .board-container {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            overflow: hidden;
            background-color: #dcb35c;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        #messageBox {
            margin-top: 14px;
            font-size: 14px;
            color: #fbc531;
            min-height: 22px;
            text-align: center;
            max-width: 560px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-link">← Trang chủ</a>
        <h1>CHƠI VỚI MÁY (MCTS)</h1>
        <span></span>
    </div>

    <div class="controls">
        <select id="difficultySelect">
            <option value="easy">Độ khó: Dễ (200 lượt)</option>
            <option value="medium" selected>Độ khó: Trung bình (750 lượt)</option>
            <option value="hard">Độ khó: Khó (2200 lượt)</option>
        </select>

        <select id="sizeSelect">
            <option value="9" selected>Bàn 9x9</option>
            <option value="13">Bàn 13x13</option>
            <option value="19">Bàn 19x19</option>
        </select>

        <button onclick="resetGame()">Ván mới</button>
        <button class="secondary" onclick="handlePass()">Bỏ lượt</button>
        <button class="secondary" onclick="calculateFinalScore()">Tính điểm</button>
    </div>

    <div class="status-bar">
        <div class="player-info">
            <span class="stone-icon stone-black"></span>
            <span>Đen: <b id="blackCaptures">0</b></span>
        </div>
        <div id="turnIndicator">Lượt: Đen (Bạn)</div>
        <div class="player-info">
            <span class="stone-icon stone-white"></span>
            <span>Trắng: <b id="whiteCaptures">0</b></span>
        </div>
    </div>

    <div class="board-container">
        <canvas id="goBoard" width="540" height="540"></canvas>
    </div>

    <div id="messageBox"></div>

    <script src="game.js"></script>
</body>
</html>
